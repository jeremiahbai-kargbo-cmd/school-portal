<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Staff</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{--bg:#fafafa;--card:#fff;--ink:#111;--mute:#888;--line:#eee;--accent:#4f46e5;--red:#e11d48}
  @media(prefers-color-scheme:dark){
    :root{--bg:#0e0e10;--card:#17171a;--ink:#f2f2f2;--mute:#8a8a90;--line:#26262b;--accent:#818cf8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
  main{max-width:520px;margin:0 auto;padding:48px 20px}
  h1{font-size:22px;font-weight:600;margin:0 0 28px;animation:fade .6s ease both}
  h1::after{content:"";display:block;width:28px;height:3px;margin-top:10px;background:var(--accent);border-radius:2px}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
    margin-bottom:14px;animation:fade .5s ease both}
  h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
  input,select{width:100%;padding:13px;margin-bottom:10px;font:inherit;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:12px;transition:.2s}
  input:focus,select:focus{outline:0;border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  button{width:100%;padding:13px;font:inherit;font-weight:600;color:#fff;border:0;
    border-radius:12px;background:var(--accent);cursor:pointer;transition:transform .15s}
  button:active{transform:scale(.97)}
  button.ghost{background:none;color:var(--mute);width:auto;padding:0;margin:0 0 20px;font-weight:500}
  button.del{background:none;color:var(--red);width:auto;padding:4px 0 4px 12px;font-weight:500}
  button.sm{background:none;color:var(--accent);width:auto;padding:4px 0 4px 12px;font-weight:500}
  .acts{display:flex;white-space:nowrap}
  textarea{width:100%;padding:13px;margin-bottom:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;resize:vertical}
  .pl{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;margin:0 6px 6px 0;color:#fff;cursor:pointer}
  .pl-ok{background:#10b981}.pl-part{background:#f59e0b}.pl-none{background:#e11d48}
  .chip{width:92px;padding:8px 0;font-size:13px}
  .chip.Present{background:#10b981}.chip.Absent{background:#e11d48}.chip.Late{background:#f59e0b}
  .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .item small{display:block;color:var(--mute)}
  .empty{color:var(--mute);margin:0}
  .msg{margin:10px 0 0;font-size:14px;min-height:20px;word-break:break-word}
  .ok{color:#059669;font-weight:600}.bad{color:var(--red)}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Staff</h1>

  <div id="login" class="card">
    <input id="em" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Password">
    <button onclick="signIn()">Sign in</button>
    <p id="lerr" class="msg bad"></p>
  </div>

  <div id="app" class="hidden">
    <button class="ghost" onclick="signOut()">← Sign out</button>
    <div id="rep"></div>
    <div id="reg"></div>
    <div id="mgr"></div>
    <div id="tch"></div>
    <div id="cs"></div>
    <div id="forms"></div>
    <div id="stv"></div>
    <div id="ttv"></div>
  </div>
</main>

<script>
const db = supabase.createClient("https://nakgbeitslaffmncbjzp.supabase.co",
  "sb_publishable_9WG3KGWiNqpvPWKygyiQ4g_GIDTKZup",
  {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
const $ = id => document.getElementById(id);
const rpc = (fn, a) => db.rpc(fn, a);
const esc = v => String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (el,t,ok)=>{ el.className="msg "+(ok?"ok":"bad"); el.textContent=t; };
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday"];
const lists={classes:[],subjects:[],venues:[]};
let asg=[], teachers=[];
const cls=()=>lists.classes.map(x=>x.name), sub=()=>lists.subjects.map(x=>x.name);
const subFor=c=>asg.filter(a=>a.class===c).map(a=>a.subject);

const forms = [
 {t:"Add student", f:[["adm","Admission no"],["name","Full name"],["cls","Class","select",cls],["dob","Date of birth","date"],["gu","Guardian"]],
  go:v=>rpc("add_student",{p_adm:v.adm,p_name:v.name,p_class:v.cls,p_dob:v.dob||null,p_guardian:v.gu}),
  ok:d=>"Access code: "+d+" — save it now, it can't be shown again", after:()=>loadStudents()},
 {t:"Reset access code", f:[["adm","Admission no"]],
  go:v=>rpc("reset_code",{p_adm:v.adm}), ok:d=>"New code: "+d},
 {t:"Attendance", f:[["adm","Admission no"],["d","Date","date"],["s","Status","select",["Present","Absent","Late"]]],
  go:v=>rpc("add_attendance",{p_adm:v.adm,p_date:v.d,p_status:v.s}), ok:()=>"Saved"},
 {t:"Grade", f:[["adm","Admission no"],["sub","Subject","select",sub],["term","Term"],["sc","Score","number"],["g","Grade"]],
  go:v=>rpc("add_grade",{p_adm:v.adm,p_subject:v.sub,p_term:v.term,p_score:v.sc,p_grade:v.g}), ok:()=>"Saved"},
 {t:"Timetable slot", f:[["c","Class","select",cls],["d","Day","select",DAYS],["p","Period","number"],
   ["s","Subject","select",()=>subFor(($("f4_c")||{}).value)],["st","Start","time"],["en","End","time"]],
  go:v=>{ const a=asg.find(x=>x.class===v.c&&x.subject===v.s)||{};
    return db.from("timetable").insert({class:v.c,day:v.d,period:v.p,subject:v.s,start_time:v.st,end_time:v.en,teacher:a.teacher||null,venue:a.venue||null}); },
  ok:()=>"Saved", after:()=>loadTT()},
 {t:"Announcement", f:[["ti","Title"],["b","Message"],["c","Send to","select",()=>["",...cls()]],
   ["adm","Or one student (admission no, optional)"]],
  go:v=>db.from("announcements").insert({title:v.ti,body:v.b,
    audience:v.adm?"student":v.c?"class":"all", target:v.adm||v.c||null}),
  ok:()=>"Posted"}
];

function build(){
  $("reg").innerHTML=`<div class="card"><h2>Daily attendance</h2>
    <input id="rg_date" type="date"><div id="rg_stat"></div>
    <h2 style="margin-top:14px">Whole school: list who is absent or late</h2>
    <textarea id="rg_abs" rows="3" placeholder="Absent: admission numbers, separated by commas, spaces or new lines"></textarea>
    <textarea id="rg_late" rows="2" placeholder="Late: admission numbers"></textarea>
    <input id="rg_file" type="file" accept=".csv,.txt" title="Optional CSV: admission_no,status">
    <label style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" id="rg_rest" checked style="width:auto;margin:0"> Everyone not listed is Present</label>
    <button onclick="saveWhole()">Review and save for the whole school</button><p class="msg" id="rg_msg2"></p>
    <small style="color:var(--mute)">Optional CSV: admission_no, status (Present, Absent, Late). Saving again for the same date overwrites earlier marks.</small>
    <h2 style="margin-top:18px">One class at a time</h2>
    <select id="rg_cls"></select><button onclick="loadRegister()">Open class register</button>
    <div id="rg_list"></div><p class="msg" id="rg_msg"></p></div>`;
  $("rep").innerHTML=`<div class="card"><h2>Weekly report (PDF)</h2>
    <input id="rw" type="date" title="Any date in the week"><input id="rp" type="number" value="50" title="Pass mark" placeholder="Pass mark">
    <button onclick="genReport()">Download weekly report (PDF)</button><p class="msg" id="mr"></p>
    <small style="color:var(--mute)">Pick any date in the week. The pass mark is used for academic pass rates.</small></div>`;
  $("rg_date").value=todayStr(); $("rw").value=mondayStr();
  $("rg_date").onchange=()=>{ loadStatus(); if(regRows.length) loadRegister(); };

  $("mgr").innerHTML=[["classes","Classes","Class name, e.g. 3A"],["subjects","Subjects","Subject name"],["venues","Venues","Venue name, e.g. Room 4"]].map(([t,h,p])=>
    `<div class="card"><h2>${h}</h2><div id="l_${t}"></div>
     <input id="n_${t}" placeholder="${p}" style="margin-top:12px">
     <button onclick="add('${t}')">Add</button><p class="msg" id="mm_${t}"></p></div>`).join("");

  $("forms").innerHTML = forms.map((fm,i)=>`<div class="card" style="animation-delay:${i*.06}s">
    <h2>${fm.t}</h2>`+fm.f.map(([id,l,ty,opt])=>
      ty==="select"
        ? `<select id="f${i}_${id}">${Array.isArray(opt)?opt.map(o=>`<option>${o}</option>`).join(""):""}</select>`
        : `<input id="f${i}_${id}" type="${ty||"text"}" placeholder="${l}" ${ty==="date"||ty==="time"?`title="${l}"`:""}>`
    ).join("")+`<button onclick="run(${i})">Save</button><p class="msg" id="m${i}"></p></div>`).join("");

  $("tch").innerHTML=`<div class="card"><h2>Teachers</h2><div id="tl"></div>
    <input id="t_name" placeholder="Full name" style="margin-top:12px"><input id="t_phone" placeholder="Phone (optional)">
    <input id="t_email" type="email" placeholder="Email (optional)"><input id="t_notes" placeholder="Details, e.g. qualification (optional)">
    <button id="t_btn" onclick="saveTeacher()">Add teacher</button>
    <button class="ghost hidden" id="t_cancel" style="margin:12px 0 0" onclick="clearTeacher()">Cancel</button><p class="msg" id="mt"></p></div>`;
  $("cs").innerHTML=`<div class="card"><h2>Class subjects</h2><div id="csl" style="margin-bottom:14px"></div>
    <select id="a_c"></select><select id="a_s"></select><select id="a_t"></select><select id="a_v"></select>
    <button onclick="assign()">Assign to class</button><p class="msg" id="mcs"></p></div>`;

  $("stv").innerHTML=`<div class="card"><h2>Students <span id="scount"></span></h2>
    <input id="sq" placeholder="Search name or admission no" oninput="renderStudents()">
    <select id="sc" onchange="renderStudents()"></select>
    <div id="se" class="hidden" style="border-top:1px solid var(--line);padding-top:14px;margin-bottom:14px">
      <h2>Edit student</h2>
      <input id="se_adm" placeholder="Admission no"><input id="se_name" placeholder="Full name">
      <select id="se_cls"></select><input id="se_dob" type="date" title="Date of birth">
      <input id="se_gu" placeholder="Guardian">
      <button onclick="saveEdit()">Save changes</button>
      <button class="ghost" style="margin:12px 0 0" onclick="$('se').classList.add('hidden')">Cancel</button>
    </div><div id="sl"></div><p class="msg" id="ms"></p></div>`;

  $("ttv").innerHTML=`<div class="card"><h2>School timetable</h2>
    <select id="ttc" onchange="loadTT()"></select><div id="ttl"></div><p class="msg" id="mtt"></p></div>`;
  $("f4_c").onchange=fillSelects;
}

function fillSelects(){
  forms.forEach((fm,i)=>fm.f.forEach(([id,,ty,opt])=>{
    if(ty!=="select"||typeof opt!=="function") return;
    const s=$(`f${i}_${id}`), keep=s.value;
    s.innerHTML=opt().map(o=>`<option value="${esc(o)}">${o===""?"All classes":esc(o)}</option>`).join("");
    if(keep) s.value=keep;
  }));
  const tc=$("ttc"), k=tc.value;
  tc.innerHTML='<option value="">All classes</option>'+cls().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  if(k) tc.value=k;
  const sc=$("sc"), k2=sc.value;
  sc.innerHTML='<option value="">All classes</option>'+cls().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  if(k2) sc.value=k2;
  const fill=(id,items,blank)=>{ const e=$(id), k=e.value;
    e.innerHTML=(blank?`<option value="">${blank}</option>`:"")+items.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("");
    if(k) e.value=k; };
  fill("a_c",lists.classes.map(x=>[x.name,x.name]));
  fill("a_s",lists.subjects.map(x=>[x.name,x.name]));
  fill("a_t",teachers.map(x=>[x.id,x.full_name]),"No teacher yet");
  fill("a_v",lists.venues.map(x=>[x.id,x.name]),"No venue yet");
  fill("rg_cls",lists.classes.map(x=>[x.name,x.name]));
}

let tEdit=null;
async function loadTeachers(){
  const {data,error}=await db.from("teachers").select("id,full_name,phone,email,notes").order("full_name");
  if(error){ say($("mt"),error.message); return; }
  teachers=data||[]; renderTeachers(); fillSelects();
}
function renderTeachers(){
  $("tl").innerHTML=teachers.length?teachers.map((x,i)=>{
    const cl=asg.filter(a=>a.teacher_id===x.id).map(a=>a.class+" "+a.subject).join(", ");
    return `<div class="item"><div>${esc(x.full_name)}<small>${esc([x.phone,x.email].filter(Boolean).join(" · "))}</small>${x.notes?`<small>${esc(x.notes)}</small>`:""}${cl?`<small>Teaches: ${esc(cl)}</small>`:""}</div>
    <div class="acts"><button class="sm" onclick="editTeacher(${i})">Edit</button><button class="del" onclick="delTeacher(${i})">Delete</button></div></div>`;
  }).join(""):'<p class="empty">None yet.</p>';
}
async function saveTeacher(){
  const m=$("mt"), row={full_name:$("t_name").value.trim(),phone:$("t_phone").value.trim()||null,
    email:$("t_email").value.trim()||null,notes:$("t_notes").value.trim()||null};
  if(!row.full_name){ say(m,"Enter the teacher's name."); return; }
  const {error}=tEdit?await db.from("teachers").update(row).eq("id",tEdit):await db.from("teachers").insert(row);
  if(error){ say(m,error.message); return; }
  const w=tEdit?"Updated":"Added"; clearTeacher(); say(m,w,true); loadTeachers(); loadAsg();
}
function clearTeacher(){
  tEdit=null; ["t_name","t_phone","t_email","t_notes"].forEach(i=>$(i).value="");
  $("t_btn").textContent="Add teacher"; $("t_cancel").classList.add("hidden"); $("mt").textContent="";
}
function editTeacher(i){
  const x=teachers[i]; tEdit=x.id;
  $("t_name").value=x.full_name||""; $("t_phone").value=x.phone||""; $("t_email").value=x.email||""; $("t_notes").value=x.notes||"";
  $("t_btn").textContent="Save changes"; $("t_cancel").classList.remove("hidden");
  $("t_name").scrollIntoView({behavior:"smooth",block:"center"});
}
async function delTeacher(i){
  const x=teachers[i];
  if(!confirm(`Delete ${x.full_name}? Their class assignments stay but will show no teacher.`)) return;
  const {error}=await db.from("teachers").delete().eq("id",x.id);
  if(error){ say($("mt"),error.message); return; }
  loadTeachers(); loadAsg();
}

async function loadAsg(){
  const {data,error}=await db.from("class_subjects").select("id,class,subject,teacher_id,teachers(full_name),venues(name)");
  if(error){ say($("mcs"),error.message); return; }
  asg=(data||[]).map(a=>({id:a.id,class:a.class,subject:a.subject,teacher_id:a.teacher_id,
    teacher:a.teachers?a.teachers.full_name:null,venue:a.venues?a.venues.name:null}));
  renderCS(); renderTeachers(); fillSelects();
}
function renderCS(){
  const g=lists.classes.map(c=>[c.name,asg.filter(a=>a.class===c.name).sort((a,b)=>a.subject.localeCompare(b.subject))]).filter(x=>x[1].length);
  $("csl").innerHTML=g.length?g.map(([c,r])=>`<h2 style="margin:12px 0 2px">${esc(c)}</h2>`+r.map(a=>
    `<div class="item"><div>${esc(a.subject)}<small>${esc([a.teacher,a.venue].filter(Boolean).join(" · ")||"No teacher or venue yet")}</small></div>
     <button class="del" onclick="delAsg('${esc(a.id)}')">Remove</button></div>`).join("")).join("")
    :'<p class="empty">No subjects assigned to classes yet.</p>';
}
async function assign(){
  const m=$("mcs"), c=$("a_c").value, s=$("a_s").value;
  if(!c||!s){ say(m,"Choose a class and a subject."); return; }
  const {error}=await db.from("class_subjects").upsert({class:c,subject:s,teacher_id:$("a_t").value||null,venue_id:$("a_v").value||null},{onConflict:"school_id,class,subject"});
  if(error){ say(m,error.message); return; }
  say(m,`${s} assigned to ${c}`,true); loadAsg();
}
async function delAsg(id){
  const {error}=await db.from("class_subjects").delete().eq("id",id);
  if(error){ say($("mcs"),error.message); return; }
  loadAsg();
}

let students=[], editing=null;
function editStudent(i){
  const s=students[i]; editing=s;
  const names=cls(); if(s.class&&!names.includes(s.class)) names.unshift(s.class);
  $("se_cls").innerHTML=names.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  $("se_cls").value=s.class||"";
  $("se_adm").value=s.admission_no||""; $("se_name").value=s.name||"";
  $("se_dob").value=s.dob||""; $("se_gu").value=s.guardian||"";
  $("se").classList.remove("hidden"); $("se").scrollIntoView({behavior:"smooth",block:"center"});
}
async function saveEdit(){
  const m=$("ms"), s=editing; if(!s) return;
  if(!$("se_name").value.trim()||!$("se_adm").value.trim()){ say(m,"Name and admission no are required."); return; }
  const {error}=await rpc("update_student",{p_school:s.school_id,p_adm:s.admission_no,p_new_adm:$("se_adm").value.trim(),
    p_name:$("se_name").value.trim(),p_class:$("se_cls").value,p_dob:$("se_dob").value||null,p_guardian:$("se_gu").value.trim()});
  if(error){ say(m,error.code==="23505"?"That admission number is already in use at this school.":error.message); return; }
  $("se").classList.add("hidden"); say(m,"Student updated",true); loadStudents();
}
async function delStudent(i){
  const s=students[i];
  const a=prompt(`This permanently deletes ${s.name} and all their records (attendance, grades, access).\n\nType the admission number to confirm:`);
  if(a===null) return;
  if(a.trim()!==String(s.admission_no)){ say($("ms"),"Admission number didn't match. Nothing deleted."); return; }
  const {error}=await rpc("delete_student",{p_school:s.school_id,p_adm:s.admission_no});
  if(error){ say($("ms"),error.message); return; }
  say($("ms"),"Student deleted",true); loadStudents();
}
async function loadStudents(){
  const {data,error}=await db.rpc("list_my_students");
  if(error){ say($("ms"),error.message); return; }
  students=(data||[]).sort((a,b)=>String(a.class).localeCompare(String(b.class),undefined,{numeric:true})||String(a.name).localeCompare(b.name));
  renderStudents();
}
function renderStudents(){
  const q=$("sq").value.trim().toLowerCase(), c=$("sc").value;
  const r=students.filter(s=>(!c||s.class===c)&&(!q||String(s.name).toLowerCase().includes(q)||String(s.admission_no).toLowerCase().includes(q)));
  $("scount").textContent="("+r.length+")";
  $("sl").innerHTML=r.length?r.slice(0,200).map(s=>{const i=students.indexOf(s);return `<div class="item"><div>${esc(s.name)}<small>${esc(s.admission_no)} · ${esc(s.class)}${s.guardian?" · "+esc(s.guardian):""}</small></div>
    <div class="acts"><button class="sm" onclick="editStudent(${i})">Edit</button><button class="del" onclick="delStudent(${i})">Delete</button></div></div>`}).join("")+(r.length>200?'<p class="empty" style="margin-top:10px">Showing 200 of '+r.length+'. Use search or the class filter.</p>':""):'<p class="empty">No students found.</p>';
}

async function load(){
  for(const t of ["classes","subjects","venues"]){
    const {data}=await db.from(t).select("id,name");
    lists[t]=(data||[]).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    $("l_"+t).innerHTML=lists[t].length?lists[t].map((x,i)=>
      `<div class="item"><span>${esc(x.name)}</span><button class="del" onclick="del('${t}',${i})">Delete</button></div>`).join("")
      :'<p class="empty">None yet.</p>';
  }
  fillSelects();
}

async function add(t){
  const inp=$("n_"+t), n=inp.value.trim(), m=$("mm_"+t);
  if(!n){ say(m,"Enter a name."); return; }
  const {error}=await db.from(t).insert({name:n});
  if(error){ say(m,error.code==="23505"?"Already exists.":error.message); return; }
  inp.value=""; say(m,"Added",true); load();
}
async function del(t,i){
  const x=lists[t][i];
  if(!confirm(`Delete "${x.name}"? Existing records keep the name, but it can no longer be selected.`)) return;
  const {error}=await db.from(t).delete().eq("id",x.id);
  if(error){ say($("mm_"+t),error.message); return; }
  load();
}

async function loadTT(){
  const c=$("ttc").value;
  let q=db.from("timetable").select("*").order("period");
  if(c) q=q.eq("class",c);
  const {data,error}=await q;
  if(error){ say($("mtt"),error.message); return; }
  const rows=data||[];
  $("ttl").innerHTML=rows.length?DAYS.map(d=>{
    const r=rows.filter(x=>x.day===d);
    return r.length?`<h2 style="margin:14px 0 4px">${d}</h2>`+r.map(x=>
      `<div class="item"><div>P${esc(x.period)} · ${esc(x.subject)}<small>${c?"":esc(x.class)+" · "}${esc((x.start_time||"").slice(0,5))}–${esc((x.end_time||"").slice(0,5))}${x.teacher||x.venue?" · "+esc([x.teacher,x.venue].filter(Boolean).join(" · ")):""}</small></div>
       <button class="del" onclick="delSlot('${esc(x.id)}')">Delete</button></div>`).join(""):"";
  }).join(""):'<p class="empty">No slots yet.</p>';
}
async function delSlot(id){

async function run(i){
  const fm=forms[i], m=$("m"+i), v={};
  fm.f.forEach(([id])=>v[id]=$(`f${i}_${id}`).value.trim());
  for(const [id,,ty,opt] of fm.f)
    if(ty==="select"&&typeof opt==="function"&&!v[id]&&!opt().includes("")){
      say(m,"Nothing to select yet. Add classes and assign subjects to them first."); return; }
  m.className="msg"; m.textContent="…";
  const {data,error}=await fm.go(v);
  if(error){ say(m,error.code==="23505"||/duplicate key/i.test(error.message)?"That admission number is already in use at this school.":error.message); return; }

}

/* ---------- Daily register ---------- */
let reg={}, regRows=[];
const normStatus=x=>{ const s=String(x||"").trim().toLowerCase(); return s.startsWith("p")?"Present":s.startsWith("a")?"Absent":s.startsWith("l")?"Late":null; };
const localISO=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function todayStr(){ return localISO(new Date()); }
function mondayStr(){ const d=new Date(), dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow-(dow<2?7:0)); return localISO(d); }

async function loadRegister(){
  const c=$("rg_cls").value, date=$("rg_date").value;
  if(!c){ say($("rg_msg"),"Add classes first."); return; }
  regRows=students.filter(s=>s.class===c).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  reg={}; regRows.forEach(s=>reg[s.admission_no]="Present");
  let had=0;
  if(date){ const {data}=await rpc("attendance_for",{p_date:date,p_class:c});
    (data||[]).forEach(r=>{ const st=normStatus(r.status); if(st&&r.adm in reg){ reg[r.adm]=st; had++; } }); }
  renderRegister();
  $("rg_msg").className="msg"; $("rg_msg").textContent=had?"Showing attendance already saved for this date. Saving will overwrite it.":"";
}
function openClass(i){ $("rg_cls").value=statRows[i].class; loadRegister(); $("rg_cls").scrollIntoView({behavior:"smooth",block:"center"}); }
let statRows=[];
async function loadStatus(){
  const date=$("rg_date").value, e=$("rg_stat"); if(!date||!e) return;
  const {data,error}=await rpc("attendance_status",{p_date:date});
  if(error){ e.innerHTML=""; return; }
  statRows=(data||[]).sort((a,b)=>String(a.class).localeCompare(String(b.class),undefined,{numeric:true}));
  const rec=statRows.reduce((s,x)=>s+x.recorded,0), en=statRows.reduce((s,x)=>s+x.enrolled,0);
  e.innerHTML=`<p class="empty" style="margin:0 0 8px">${rec} of ${en} pupils recorded for this date. Tap a class to open it.</p>`+
    statRows.map((x,i)=>`<span class="pl ${x.recorded>=x.enrolled?"pl-ok":x.recorded?"pl-part":"pl-none"}" onclick="openClass(${i})">${esc(x.class)} · ${x.recorded}/${x.enrolled}</span>`).join("");
}
function renderRegister(){
  if(!regRows.length){ $("rg_list").innerHTML='<p class="empty" style="margin-top:12px">No students in this class.</p>'; return; }
  $("rg_list").innerHTML='<p class="empty" style="margin:12px 0 4px">Everyone starts as Present. Tap a pupil to change: Present, Absent, Late.</p>'+
    regRows.map((s,i)=>`<div class="item"><div>${esc(s.name)}<small>${esc(s.admission_no)}</small></div>
    <button class="chip ${reg[s.admission_no]}" id="ch${i}" onclick="cycle(${i})">${reg[s.admission_no]}</button></div>`).join("")+
    '<p class="msg" id="rg_sum"></p><button onclick="saveRegister()">Save attendance</button>';
  sumRegister();
}
function cycle(i){
  const a=regRows[i].admission_no, n=["Present","Absent","Late"][(["Present","Absent","Late"].indexOf(reg[a])+1)%3];
  reg[a]=n; const b=$("ch"+i); b.textContent=n; b.className="chip "+n; sumRegister();
}
function sumRegister(){
  const v=Object.values(reg), ab=v.filter(x=>x==="Absent").length, lt=v.filter(x=>x==="Late").length;
  const e=$("rg_sum"); if(e){ e.className="msg"; e.textContent=`${v.length} pupils: ${v.length-ab-lt} present, ${ab} absent, ${lt} late`; }
}
async function saveRegister(){
  const recs=regRows.map(s=>({adm:s.admission_no,status:reg[s.admission_no]}));
  await saveRecords(recs,$("rg_date").value,$("rg_msg"));
}
async function saveRecords(recs,date,m){
  if(!date){ say(m,"Choose a date."); return null; }
  let saved=0,skipped=0,errs=[];
  for(let i=0;i<recs.length;i+=400){
    say(m,`Saving ${Math.min(i+400,recs.length)} of ${recs.length}…`,true);
    const {data,error}=await rpc("add_attendance_bulk",{p_date:date,p_records:recs.slice(i,i+400)});
    if(error){ say(m,error.message); return null; }
    saved+=data.saved; skipped+=data.skipped; errs.push(...data.errors);
  }
  let t=`Saved ${saved} of ${recs.length}.`;
  if(skipped) t+=` ${skipped} already had a record for that date.`;
  if(errs.length) t+=` ${errs.length} failed (e.g. ${errs.slice(0,3).map(e=>e.adm+": "+e.err).join("; ")}).`;
  say(m,t,!errs.length&&!skipped);
  loadStatus();
  return {saved,skipped,errs};
}
async function saveWhole(){
  const m=$("rg_msg2"), date=$("rg_date").value;
  if(!date){ say(m,"Choose a date."); return; }
  if(!students.length){ say(m,"Student list hasn't loaded yet. Try again."); return; }
  const known=new Set(students.map(s=>String(s.admission_no))), map=new Map(); let bad=0;
  const toks=id=>$(id).value.split(/[\s,;]+/).filter(Boolean);
  toks("rg_late").forEach(a=>map.set(a,"Late"));
  toks("rg_abs").forEach(a=>map.set(a,"Absent"));
  const f=$("rg_file").files[0];
  if(f){
    (await f.text()).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
      const [a,s]=l.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,""));
      if(!a||(i===0&&/adm|number|^id$/i.test(a))) return;
      const st=normStatus(s)||(s===undefined?"Absent":null);
      if(!st){ bad++; return; } map.set(a,st); });
  }
  const unknown=[...map.keys()].filter(a=>!known.has(a)); unknown.forEach(a=>map.delete(a));
  if($("rg_rest").checked) students.forEach(s=>{ const a=String(s.admission_no); if(!map.has(a)) map.set(a,"Present"); });
  const recs=[...map].map(([adm,status])=>({adm,status}));
  if(!recs.length){ say(m,"Nothing to save."); return; }
  const c=x=>recs.filter(r=>r.status===x).length;
  let msg=`Save for ${date}?\n\nPresent: ${c("Present")}\nAbsent: ${c("Absent")}\nLate: ${c("Late")}`;
  if(unknown.length) msg+=`\n\nNot found and ignored (${unknown.length}): ${unknown.slice(0,8).join(", ")}${unknown.length>8?"...":""}`;
  if(bad) msg+=`\n${bad} unreadable file rows ignored.`;
  if(!confirm(msg)) return;
  const r=await saveRecords(recs,date,m);
  if(r&&!r.errs.length){ $("rg_abs").value=""; $("rg_late").value=""; $("rg_file").value=""; }
}

/* ---------- Weekly report (PDF) ---------- */
const pct=(a,b)=>b?100*a/b:0, f1=x=>(+x).toFixed(1);
const isoAdd=(s,n)=>{ const x=new Date(s+"T00:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const dayName=s=>new Date(s+"T00:00:00Z").toUTCString().slice(0,3);
const niceDate=s=>new Date(s+"T00:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
function wilson(k,n){ if(!n) return [0,0]; const z=1.96,p=k/n,d=1+z*z/n,c=p+z*z/(2*n),h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n)); return [100*(c-h)/d,100*(c+h)/d]; }
function pval(z){ z=Math.abs(z); const t=1/(1+0.2316419*z), d=0.3989423*Math.exp(-z*z/2);
  return 2*d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); }
function bars(doc,x,y,w,h,labels,vals,color){
  const g=w/vals.length, bw=g*0.6;
  doc.setDrawColor(200); doc.line(x,y+h,x+w,y+h);
  vals.forEach((v,i)=>{ const bh=Math.max(0,Math.min(100,v))/100*h;
    doc.setFillColor(...color); doc.rect(x+i*g+(g-bw)/2,y+h-bh,bw,bh,"F");
    doc.setFontSize(8); doc.setTextColor(60);
    doc.text(f1(v)+"%",x+i*g+g/2,y+h-bh-1.5,{align:"center"}); doc.text(labels[i],x+i*g+g/2,y+h+4,{align:"center"}); });
}

async function genReport(){
  const m=$("mr"), wk=$("rw").value, pass=+$("rp").value||50;
  if(!wk){ say(m,"Choose a week."); return; }
  if(!(window.jspdf&&window.jspdf.jsPDF)){ say(m,"PDF tools are still loading. Try again in a moment."); return; }
  say(m,"Analysing the data…",true);
  const {data:d,error}=await rpc("weekly_report",{p_week:wk,p_pass:pass});
  if(error){ say(m,error.message); return; }
  const w0=d.week_start;
  const agg=rs=>rs.reduce((a,r)=>({p:a.p+r.present,a:a.a+r.absent,l:a.l+r.late,t:a.t+r.total}),{p:0,a:0,l:0,t:0});
  const inWk=(r,k)=>r.d>=isoAdd(w0,-7*k)&&r.d<=isoAdd(w0,-7*k+4);
  const W=[3,2,1,0].map(k=>({k,...agg(d.days.filter(r=>inWk(r,k)))}));
  const cur=W[3], prev=W[2], att=x=>x.p+x.l, rate=x=>pct(att(x),x.t);
  if(!cur.t){ say(m,"No attendance has been recorded for that week."); return; }
  const [lo,hi]=wilson(att(cur),cur.t), P=att(cur)/cur.t;
  let chg=null,pv=null;
  if(prev.t){ const p0=att(prev)/prev.t, pp=(att(cur)+att(prev))/(cur.t+prev.t), se=Math.sqrt(pp*(1-pp)*(1/cur.t+1/prev.t));
    chg=100*(P-p0); pv=se>0?pval((P-p0)/se):1; }
  const sigTxt=pv===null?"":pv<0.05?"statistically significant":"not statistically significant";
  const dir=chg===null?"":Math.abs(chg)<0.05?"unchanged":chg>0?"up":"down";
  const daysW=d.days.filter(r=>inWk(r,0)).sort((a,b)=>a.d.localeCompare(b.d));
  const comp=daysW.map(r=>pct(r.total,d.enrolled));
  const cls=d.by_class.map(r=>{ const pc=att(r)/r.total, z=(P>0&&P<1)?(pc-P)/Math.sqrt(P*(1-P)/r.total):0;
    return {...r,rate:100*pc,late:pct(r.late,r.total),abs:pct(r.absent,r.total),flag:z<-1.96?"Below":z>1.96?"Above":"In line"}; }).sort((a,b)=>a.rate-b.rate);
  const atRiskN=d.absence_dist.filter(x=>x.ab>=2).reduce((s,x)=>s+x.n,0);
  const prevAt=null;
  const gs=d.grades_subject, gn=gs.reduce((s,r)=>s+r.n,0);
  const gMean=gn?gs.reduce((s,r)=>s+r.mean*r.n,0)/gn:0, gPass=gn?100*gs.reduce((s,r)=>s+r.pass_n,0)/gn:0;
  const cov=d.coverage;

  const sum=[];
  sum.push(`Attendance: ${f1(100*P)}% of pupil-days were attended (95% confidence interval ${f1(lo)}% to ${f1(hi)}%) across ${d.enrolled} enrolled pupils.`+
    (chg===null?" There is no previous week to compare against.":` This is ${dir==="unchanged"?"unchanged":dir+" "+f1(Math.abs(chg))+" percentage points"} from last week, a change that is ${sigTxt} (p = ${pv<0.001?"<0.001":pv.toFixed(3)}).`));
  if(cls.length>1) sum.push(`Strongest class: ${cls[cls.length-1].class} (${f1(cls[cls.length-1].rate)}%). Weakest class: ${cls[0].class} (${f1(cls[0].rate)}%). ${cls.filter(c=>c.flag==="Below").length} class(es) were significantly below the school average.`);
  sum.push(`${atRiskN} pupils (${f1(pct(atRiskN,d.enrolled))}% of enrolment) were absent on 2 or more days this week.`);
  const lowC=daysW.filter((r,i)=>comp[i]<95);
  if(lowC.length) sum.push(`Data quality warning: attendance was recorded for fewer than 95% of pupils on ${lowC.map(r=>dayName(r.d)).join(", ")}. Rates for those days may be unreliable.`);
  if(gn) sum.push(`Academic records: ${gn} scores on file, average ${f1(gMean)}, with ${f1(gPass)}% at or above the pass mark of ${pass}.`);
  if(cov.classes_without_subjects.length||cov.without_teacher) sum.push(`Staffing and curriculum: ${cov.classes_without_subjects.length} class(es) have no subjects assigned and ${cov.without_teacher} of ${cov.assignments} class-subject assignments have no teacher.`);

  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}), L=15, R=195; let y=0;
  const H=t=>{ if(y>250){ doc.addPage(); y=20; } doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(30); doc.text(t,L,y);
    doc.setDrawColor(79,70,229); doc.setLineWidth(.6); doc.line(L,y+2,L+12,y+2); y+=9; };
  const Pg=(t,sz=10,col=60)=>{ doc.setFont("helvetica","normal"); doc.setFontSize(sz); doc.setTextColor(col);
    doc.splitTextToSize(t,R-L).forEach(l=>{ if(y>280){ doc.addPage(); y=20; } doc.text(l,L,y); y+=sz*0.42+1.4; }); y+=1.5; };
  const T=(head,body)=>{ doc.autoTable({startY:y,head:[head],body,styles:{fontSize:9,cellPadding:2},headStyles:{fillColor:[79,70,229]},margin:{left:L,right:15}}); y=doc.lastAutoTable.finalY+8; };

  let schoolName="School"; try{ const {data:sl}=await rpc("list_schools"); const s=(sl||[]).find(x=>x.id===d.school_id); if(s) schoolName=s.name; }catch(e){}
  doc.setFillColor(79,70,229); doc.rect(0,0,210,34,"F");
  doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("Weekly School Report",L,15);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text(`${schoolName}  |  ${niceDate(w0)} to ${niceDate(isoAdd(w0,4))}`,L,23);
  doc.setFontSize(8); doc.text(`Generated ${niceDate(localISO(new Date()))}`,L,29);
  y=46;

  H("1. Executive summary"); sum.forEach(s=>Pg("- "+s));

  H("2. Key indicators");
  const arrow=(a,b,inv)=>b==null?"n/a":(a-b>=0?"+":"")+f1(a-b)+" pts";
  const pr=prev.t?rate(prev):null;
  T(["Indicator","This week","Last week","Change"],[
    ["Attendance rate (present + late)",f1(rate(cur))+"%",pr==null?"n/a":f1(pr)+"%",pr==null?"n/a":arrow(rate(cur),pr)],
    ["95% confidence interval",`${f1(lo)}% - ${f1(hi)}%`,"",""],
    ["Absence rate",f1(pct(cur.a,cur.t))+"%",prev.t?f1(pct(prev.a,prev.t))+"%":"n/a",prev.t?arrow(pct(cur.a,cur.t),pct(prev.a,prev.t)):"n/a"],
    ["Late rate",f1(pct(cur.l,cur.t))+"%",prev.t?f1(pct(prev.l,prev.t))+"%":"n/a",prev.t?arrow(pct(cur.l,cur.t),pct(prev.l,prev.t)):"n/a"],
    ["Pupils absent 2+ days",`${atRiskN} (${f1(pct(atRiskN,d.enrolled))}%)`,"",""],
    ["Enrolment",String(d.enrolled),"",""],
    ["Pupil-days recorded",String(cur.t),String(prev.t||"n/a"),""]]);

  H("3. Daily attendance");
  if(y>200){ doc.addPage(); y=20; }
  bars(doc,L+5,y+4,R-L-10,40,daysW.map(r=>dayName(r.d)),daysW.map(r=>pct(r.present+r.late,r.total)),[79,70,229]); y+=58;
  T(["Day","Date","Recorded","Present","Late","Absent","Rate","Coverage"],daysW.map((r,i)=>[dayName(r.d),niceDate(r.d),r.total,r.present,r.late,r.absent,f1(pct(r.present+r.late,r.total))+"%",f1(comp[i])+"%"]));

  const tr=W.filter(w=>w.t);
  if(tr.length>1){ H("4. Four-week trend"); if(y>200){ doc.addPage(); y=20; }
    bars(doc,L+10,y+4,R-L-20,38,tr.map(w=>"Wk "+niceDate(isoAdd(w0,-7*w.k)).slice(0,6)),tr.map(rate),[16,185,129]); y+=56; }

  H("5. Attendance by class");
  T(["Class","Pupil-days","Attendance","Late","Absent","Versus school"],cls.map(c=>[c.class,c.total,f1(c.rate)+"%",f1(c.late)+"%",f1(c.abs)+"%",c.flag]));

  H("6. Pupils needing attention (absent 2+ days)");
  if(d.at_risk.length) T(["Name","Class","Admission","Absent","Late"],d.at_risk.map(r=>[r.name,r.class,r.adm,r.absent,r.late]));
  else Pg("No pupils were absent on two or more days.");
  if(atRiskN>d.at_risk.length) Pg(`Showing the ${d.at_risk.length} highest of ${atRiskN} pupils.`,9,110);

  H("7. Academic performance");
  if(gs.length){
    T(["Subject","Term","Scores","Mean (95% CI)","Median","Std dev","Pass rate"],gs.map(r=>{ const e=r.n>1?1.96*r.sd/Math.sqrt(r.n):0;
      return [r.subject,r.term,r.n,`${f1(r.mean)} (${f1(r.mean-e)}-${f1(r.mean+e)})`,f1(r.median),f1(r.sd),f1(pct(r.pass_n,r.n))+"%"]; }));
    T(["Class","Term","Scores","Mean","Pass rate"],d.grades_class.map(r=>[r.class,r.term,r.n,f1(r.mean),f1(pct(r.pass_n,r.n))+"%"]));
    Pg("Grades are recorded per term, so this section is a cumulative snapshot, not a measure of this week alone.",9,110);
  } else Pg("No grades have been recorded yet.");

  H("8. Curriculum and staffing coverage");
  T(["Measure","Value"],[["Teachers on record",String(cov.teachers)],["Class-subject assignments",String(cov.assignments)],
    ["Assignments with no teacher",String(cov.without_teacher)],["Classes with no subjects assigned",cov.classes_without_subjects.join(", ")||"None"]]);

  H("9. Method and definitions");
  [`Attendance rate = (present + late) / all recorded pupil-days. Absence rate = absent / all recorded pupil-days.`,
   `Confidence interval: Wilson score interval at 95%, which stays reliable for rates near 100%.`,
   `Week-on-week change: two-proportion z-test. "Statistically significant" means a gap this size would occur by chance less than 5% of the time. Pupil-days are treated as independent, so p-values are approximate.`,
   `Class comparison: each class's attendance is tested against the school-wide rate; "Below" or "Above" means the gap exceeds 1.96 standard errors.`,
   `Coverage = pupils with an attendance record that day / enrolled pupils. Below 95% means the rate may be unreliable.`,
   `Pass mark used: ${pass}. Mean confidence intervals use mean +/- 1.96 x standard deviation / square root of n.`,
   `Limitations: figures depend on the accuracy and completeness of data entered by staff. Small classes produce wide uncertainty.`].forEach(s=>Pg("- "+s,9,90));

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(140); doc.text(`${schoolName} - Weekly School Report - Page ${i} of ${n}`,105,291,{align:"center"}); }
  doc.save(`weekly-report-${w0}.pdf`);
  say(m,"Report downloaded.",true);
}
